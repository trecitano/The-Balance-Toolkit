name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardware-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake pkg-config libudev-dev libdbus-1-dev libssl-dev
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.14
      - name: Install locked frontend dependencies
        run: mise exec -- bun install --frozen-lockfile
      - name: Verify
        run: mise run verify

  android-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.14
          install: false
      - name: Verify Android shared fixtures
        run: mise run test:android
