[package]
name = "toolkit-cli"
description = "Headless command-line frontend for The Balance Toolkit: pair boards, record and replay sessions, stream over TCP and LSL without a window."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "tbt"
path = "src/main.rs"

[dependencies]
toolkit-core.workspace = true
anyhow.workspace = true
clap = { version = "4.6", features = ["derive", "wrap_help"] }
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }

[dev-dependencies]
tempfile = "3"
