[package]
name = "balance-toolkit-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.28", features = ["time", "rt", "macros", "net"] }
anyhow = "1.0"
futures = "0.3"
hidapi = "2.6.3"
env_logger = "0.11"
log = "0.4"
lsl = {git = "https://github.com/labstreaminglayer/liblsl-rust.git", branch = "main"}
chrono = { version = "0.4.41", features = ["serde"] }
dirs = "6.0"
tauri-plugin-fs = "2"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.3", features = ["bluetoothd"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.60.0", features = [
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Foundation_Collections",
] }
windows-future = "0.1.0"
windows-collections = "0.1.1"
windows-core = "0.60.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
objc2-foundation = "0.3.1"
objc2-io-bluetooth = "0.3.1"
