[package]
name = "balance-toolkit-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["mock"]
mock = []

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]
tauri = { version = "2.7.0", features = [] }
tauri-plugin-opener = "2.4.0"
tauri-plugin-fs = "2.4.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
tokio = { version = "1.47.1", features = ["time", "rt", "macros", "net"] }
anyhow = "1.0.98"
futures = "0.3.31"
hidapi = "2.6.3"
lsl = {git = "https://github.com/labstreaminglayer/liblsl-rust.git", branch = "main"}
chrono = { version = "0.4.41", features = ["serde"] }
dirs = "6.0.0"
rustfft = "6.4.0"
toml = "0.8.22"
tauri-plugin-dialog = "2"
once_cell = "1.21.3"
rand = "0.9.2"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.3", features = ["bluetoothd"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Foundation_Collections",
] }
windows-future = "0.2.1"
windows-collections = "0.2.0"
windows-core = "0.61.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
objc2-foundation = "0.3.1"
objc2-io-bluetooth = "0.3.1"
