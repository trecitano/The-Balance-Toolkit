[package]
name = "the-balance-toolkitapp"
version = "0.1.0"
description = "A Toolkit to perform operations with a Nintendo Wii Balance Board"
authors = ["you"]
license = "MIT"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
csv = "1.4.0"
dirs = "6.0.0"
futures = "0.3.31"
hidapi = "2.6.3"
lsl = { git = "https://github.com/labstreaminglayer/liblsl-rust.git", branch = "main" }
once_cell = "1.21.3"
rand = "0.9.2"
rustfft = "6.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.9.2", features = ["unstable"] }
tauri-plugin-dialog = "2.4.2"
tauri-plugin-fs = "2.4.4"
tauri-plugin-opener = "2.5.2"
tokio = { version = "1.48.0", features = ["time", "rt", "macros", "net", "process"] }
tokio-util = "0.7.16"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.3", features = ["bluetoothd"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Foundation_Collections",
] }
windows-future = "0.3.2"
windows-collections = "0.3.2"
windows-core = "0.62.2"
