[package]
name = "the-balance-toolkitapp"
version = "0.1.0"
description = "A Toolkit to perform operations with a Nintendo Wii Balance Board"
authors = ["you"]
license = "MIT"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
csv = "1.4.0"
dirs = "6.0.0"
futures = "0.3.32"
hidapi = "2.6.4"
lsl = { git = "https://github.com/labstreaminglayer/liblsl-rust.git", rev = "afa1d251674591c11ebc06070de60914b6dafccf" }
once_cell = "1.21.4"
rand = "0.10.1"
rustfft = "6.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2.11.2", features = ["unstable"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-opener = "2.5.4"
tokio = { version = "1.52.3", features = ["time", "rt", "macros", "net", "process"] }
tokio-util = "0.7.18"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.3", features = ["bluetoothd"] }
evdev = "0.12"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Foundation_Collections",
] }
windows-future = "0.3.2"
windows-collections = "0.3.2"
windows-core = "0.62.2"
