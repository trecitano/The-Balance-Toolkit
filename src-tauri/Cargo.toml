[package]
name = "the-balance-toolkitapp"
version = "0.1.0"
description = "A Toolkit to perform operations with a Nintendo Wii Balance Board"
authors = ["you"]
license = "MIT"
edition = "2024"

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = 3 # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
anyhow = "1.0.99"
async-trait = "0.1.89"
chrono = { version = "0.4.41", features = ["serde"] }
csv = "1.3.1"
dirs = "6.0.0"
futures = "0.3.31"
hidapi = "2.6.3"
lsl = { git = "https://github.com/labstreaminglayer/liblsl-rust.git", branch = "main" }
once_cell = "1.21.3"
rand = "0.9.2"
rustfft = "6.4.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tauri = { version = "2.8.5", features = [] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-fs = "2.4.2"
tauri-plugin-opener = "2.5.0"
tokio = { version = "1.47.1", features = ["time", "rt", "macros", "net"] }
tokio-util = "0.7.16"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.3", features = ["bluetoothd"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Foundation_Collections",
] }
windows-future = "0.2.1"
windows-collections = "0.2.0"
windows-core = "0.61.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
objc2-foundation = "0.3.1"
objc2-io-bluetooth = "0.3.1"
