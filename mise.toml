# Project toolchain, managed by mise (https://mise.jdx.dev).
# `setup/setup.sh` (or `setup/setup.ps1`) installs mise and runs `mise install`; these are the versions
# every platform builds with. Bump them here and rerun `mise install`.
[tools]
bun = "1.4.1"
rust = "1.98.0"
uv = "0.12.9"

# One command for every platform: bash on Linux/macOS/Git Bash, PowerShell on Windows.
# Extra arguments are forwarded, e.g. `mise run setup -- --check`.
[tasks.setup]
description = "Check the development dependencies and offer to install the missing ones"
run = "bash setup/setup.sh"
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File setup/setup.ps1"

[tasks.doctor]
description = "Check the pinned tools and dependencies for verification without hardware"
run = "bun scripts/verify/doctor.mjs"

[tasks.check]
description = "Check Rust formatting/compilation and lint/build the desktop frontend"
depends = ["check:rust", "check:frontend"]

[tasks."check:rust"]
description = "Check formatting and compile the core and CLI (no webview required)"
run = ["cargo fmt --all -- --check", "cargo check --locked -p toolkit-core -p toolkit-cli"]

[tasks."check:frontend"]
description = "Lint and build the desktop frontend without launching Tauri"
dir = "apps/tauri"
run = ["bun run lint", "bun run build"]

[tasks.test]
description = "Run deterministic core unit/fixture tests and CLI unit tests"
run = ["cargo test --locked -p toolkit-core", "cargo test --locked -p toolkit-cli --bin tbt"]

[tasks.smoke]
description = "Exercise the CLI with isolated mock recordings, replay, and failure checks"
run = "cargo test --locked -p toolkit-cli --test smoke"

[tasks.verify]
description = "Run the same hardware-free verification as CI"
run = ["mise run doctor", "mise run check", "mise run test", "mise run smoke"]

[tasks."check:desktop"]
description = "Compile the Tauri shell (requires platform Tauri dependencies)"
run = "cargo check --locked -p the-balance-toolkitapp"

[tasks."test:android"]
description = "Run Android JVM fixture tests (requires a JDK and Android SDK, no device)"
dir = "apps/android"
run = "./gradlew --console=plain :app:testDebugUnitTest"

[tasks."check:android"]
description = "Lint and build Android (requires a JDK and Android SDK)"
dir = "apps/android"
run = "./gradlew --console=plain lintKotlin detekt :app:assembleDebug"

# `mise run clean` removes every generated/cached directory. Rerun
# `mise run setup` (or `bun install` in apps/tauri, `cargo build`, `uv sync`) to restore them.
[tasks.clean]
description = "Remove build artifacts and dependency caches (target/, desktop node_modules/ and dist/, .venv, gradle)"
run = """
set -eu
cd "$MISE_PROJECT_ROOT"
for dir in \
  target \
  apps/tauri/node_modules \
  apps/tauri/dist \
  apps/tauri/dist-ssr \
  apps/tauri/src-tauri/gen/schemas \
  scripts/.venv \
  apps/android/build \
  apps/android/.gradle \
  apps/android/app/build \
  apps/android/app/.cxx; do
  if [ -e "$dir" ]; then
    echo "removing $dir"
    rm -rf "$dir"
  fi
done
find . -name __pycache__ -type d -not -path './.git/*' -prune -exec rm -rf {} +
echo "clean."
"""
